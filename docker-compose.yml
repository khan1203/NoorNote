version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Shared network so all services resolve each other by service name
# ─────────────────────────────────────────────────────────────────────────────
networks:
  app_net:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes for data persistence across container restarts
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  pg_data:
  mongo_data:

# ─────────────────────────────────────────────────────────────────────────────
# Services
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── 1. PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: pg_cont
    restart: unless-stopped
    environment:
      POSTGRES_DB:       noornote_users
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app_net
    ports:
      - "5433:5434" # HOST:CONTAINER      # expose for local inspection (optional)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── 2. MongoDB ───────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: mongo_cont
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - app_net
    ports:
      - "27017:27017"     # expose for local inspection (optional)
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── 3. FastAPI application ───────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    restart: unless-stopped
    env_file:
      - .env
    # environment:
    #   DATABASE_URL: postgresql://appuser:apppassword@postgres:5432/
    #   MONGO_URL:    mongodb://mongo:27017
    networks:
      - app_net
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy   # waits until pg_isready passes
      mongo:
        condition: service_healthy   # waits until mongosh ping passes
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s