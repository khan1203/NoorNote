# version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Shared network so all services resolve each other by service name
# ─────────────────────────────────────────────────────────────────────────────
networks:
  app_net:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes for data persistence across container restarts
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  pg_data:
  mongo_data:
  redis_data:
  es_data:

# ─────────────────────────────────────────────────────────────────────────────
### Services

services:

  # ── 1. PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: pg_cont
    restart: unless-stopped
    environment:
      POSTGRES_DB:       noornote_users
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app_net
    ports:
      - "5433:5432" # HOST:CONTAINER      # expose for local inspection (optional)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noornote_users"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── 2. MongoDB ───────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: mongo_cont
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - app_net
    ports:
      - "27017:27017"     # expose for local inspection (optional)
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── 3. FastAPI application ───────────────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - app_net
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app         
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy   # waits until mongosh ping passes
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 4. Redis Caching ───────────────────────────────────────────────
  redis:
    image: redis:7
    container_name: redis_cont
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_net
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  #──────────────────────────────────────────────────────────────────────────
  # 5. Elasticsearch for search
  #──────────────────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: es_cont
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - app_net
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  #──────────────────────────────────────────────────────────────────────────
  # 6. Kafka broker (KRaft mode - no Zookeeper needed!)
  #──────────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka_cont
    networks:
      - app_net
    ports:
      - "9092:9092"
    environment:
      # KRaft mode settings (Kafka without Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Confluent-specific KRaft settings
      CLUSTER_ID: 'o4AbQjJkQj-7ouU0TtW3GQ'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  #──────────────────────────────────────────────────────────────────────────
  # 7. Kafka Consumer 
  #──────────────────────────────────────────────────────────────────────────
  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: consumer_cont
    command: ["python", "-m", "consumer.consumer"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: noornote_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: noornote_events
      KAFKA_CONSUMER_GROUP: noornote_event_consumers
    networks:
      - app_net